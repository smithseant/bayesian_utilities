[project]
name = "bayesian-utilities"
version = "0.1.0"
description = "A few helper functions for simple Bayesian analysis in python"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.4",
    "scipy>=1.12.0",
]

[project.optional-dependencies]
plots = [
    "matplotlib>=3.7.3",
]

[build-system]
requires = ["uv_build>=0.12.14,<0.13"]
build-backend = "uv_build"
